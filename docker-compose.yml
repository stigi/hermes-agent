#
# docker-compose.yml — customized for Coolify deploy (branch: deploy)
#
# Differences from upstream main:
#   - gateway + dashboard both `build: .` with `pull_policy: build`, so Coolify
#     builds the image from source instead of trying to pull a non-existent one.
#   - OPENROUTER_API_KEY + TELEGRAM_BOT_TOKEN are injected from Coolify's
#     environment (set them as secrets in Coolify — NOT committed here).
#   - named volume `hermes-data` instead of a ~/.hermes host bind (cleaner under
#     Coolify, and keeps the agent out of a host home dir).
#   - light, s6-safe hardening: no-new-privileges + memory/pid limits.
#
# Kept from upstream (do NOT change without care):
#   - network_mode: host and the s6-overlay `/init` entrypoint. The image starts
#     as root to chown/remap to uid 10000 then drops each service to that
#     non-root user — so `cap_drop: ALL` would break init. Services already run
#     non-root, which is the main isolation.
#   - dashboard binds 127.0.0.1:9119 only. It stores API keys; do NOT expose it
#     on the LAN. Reach it via SSH tunnel:  ssh -L 9119:localhost:9119 pi
#     then open http://localhost:9119
#
services:
  gateway:
    build: .
    pull_policy: build
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - hermes-data:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    command: ["gateway", "run"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 1024

  dashboard:
    build: .
    pull_policy: build
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - hermes-data:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512

volumes:
  hermes-data:
